<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyakumeiten Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="panel-header">
        <h1>Hyakumeiten Map</h1>
        <p>百名店を地図と一覧で横断検索</p>
      </div>

      <form id="search-form" class="filters">
        <label>
          <span>Year</span>
          <input id="year-input" name="year" type="number" value="2025" min="2017" max="2025">
        </label>

        <label>
          <span>Genre Slug</span>
          <input id="genre-input" name="genre_slug" type="text" placeholder="sushi_tokyo">
        </label>

        <label>
          <span>Name</span>
          <input id="name-input" name="name_query" type="text" placeholder="鮨">
        </label>

        <label>
          <span>Region</span>
          <select id="region-input" name="region">
            <option value="">All</option>
            <option value="tohoku_hokkaido">東北北海道</option>
            <option value="kanto">関東</option>
            <option value="chubu">中部</option>
            <option value="kansai">関西</option>
            <option value="chugoku_shikoku_kyushu">中国四国九州</option>
          </select>
        </label>

        <label class="checkbox-row">
          <input id="multiple-years-input" name="has_multiple_years" type="checkbox">
          <span>複数年掲載のみ</span>
        </label>

        <div class="button-row">
          <button type="submit">Search</button>
        </div>
      </form>

      <section class="status-panel">
        <div id="status-text">地図を読み込み中...</div>
        <div id="warning-text" class="warning"></div>
      </section>

      <section class="results-panel">
        <div class="results-meta">
          <strong id="result-count">0</strong>
          <span>shops in view</span>
        </div>
        <ul id="result-list" class="result-list"></ul>
      </section>
    </aside>

    <main class="map-area">
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
