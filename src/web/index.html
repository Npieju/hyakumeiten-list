<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyakumeiten Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-controls="sidebar-content">Filters</button>
      <div id="sidebar-content" class="sidebar-content">
      <div class="panel-header">
        <h1>Hyakumeiten Map</h1>
        <p>百名店を地図と一覧で横断検索</p>
      </div>

      <form id="search-form" class="filters">
        <label>
          <span>Year</span>
          <input id="year-input" name="year" type="number" value="2025" min="2017" max="2025">
        </label>

        <label>
          <span>Genre Slug</span>
          <input id="genre-input" name="genre_slug" type="text" placeholder="sushi_tokyo">
        </label>

        <label>
          <span>Name</span>
          <input id="name-input" name="name_query" type="text" placeholder="鮨">
        </label>

        <label>
          <span>Region</span>
          <select id="region-input" name="region">
            <option value="">All</option>
            <option value="tohoku_hokkaido">東北北海道</option>
            <option value="kanto">関東</option>
            <option value="chubu">中部</option>
            <option value="kansai">関西</option>
            <option value="chugoku_shikoku_kyushu">中国四国九州</option>
          </select>
        </label>

        <label class="checkbox-row">
          <input id="multiple-years-input" name="has_multiple_years" type="checkbox">
          <span>複数年掲載のみ</span>
        </label>

        <label class="checkbox-row checkbox-accent-row">
          <input id="reservation-enabled-input" name="reservation_enabled" type="checkbox">
          <span>予約状態を取得する</span>
        </label>

        <div id="reservation-fields" class="reservation-fields is-disabled">
          <label>
            <span>Date</span>
            <input id="reservation-date-input" name="reservation_date" type="date" value="2026-05-25">
          </label>

          <label>
            <span>Party Size</span>
            <input id="party-size-input" name="party_size" type="number" min="1" max="12" value="2">
          </label>

          <label>
            <span>Time Window</span>
            <select id="time-window-input" name="time_window">
              <option value="dinner">Dinner</option>
              <option value="lunch">Lunch</option>
            </select>
          </label>

          <label>
            <span>営業・予約状態</span>
            <select id="reservation-status-input" name="reservation_status">
              <option value="">All</option>
              <option value="bookable">予約可能</option>
              <option value="sold_out">空席なし</option>
              <option value="booking_closed">受付外</option>
              <option value="temporarily_closed">休業</option>
              <option value="not_supported">予約サイト対象外</option>
              <option value="provider_unlinked">予約リンク未設定</option>
              <option value="provider_error">取得失敗</option>
              <option value="unknown">要確認</option>
            </select>
          </label>

          <label>
            <span>Provider</span>
            <select id="provider-input" name="provider">
              <option value="">All</option>
              <option value="example_provider">example_provider</option>
            </select>
          </label>
        </div>

        <div class="button-row">
          <button type="submit">Search</button>
        </div>
      </form>

      <section class="status-panel">
        <div id="status-text">地図を読み込み中...</div>
        <div id="warning-text" class="warning"></div>
      </section>

      <section class="results-panel">
        <div class="results-meta">
          <strong id="result-count">0</strong>
          <span>shops in view</span>
        </div>
        <ul id="result-list" class="result-list"></ul>
      </section>
      </div>
    </aside>

    <main class="map-area">
      <div id="map"></div>
      <section class="map-hud" aria-label="Map summary">
        <div class="map-hud-card map-hud-card-primary">
          <div class="map-hud-label">Map View</div>
          <div id="map-hud-status" class="map-hud-status">地図を読み込み中...</div>
          <div id="map-hud-filters" class="map-hud-filters">Year 2025</div>
        </div>
        <details class="map-hud-card map-hud-card-legend map-hud-legend">
          <summary class="map-hud-legend-toggle">
            <span>Legend</span>
            <span id="map-hud-legend-preview" class="map-hud-legend-preview" aria-hidden="true">
            </span>
          </summary>
          <div id="map-legend" class="map-legend">
          </div>
        </details>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
