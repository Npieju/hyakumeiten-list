<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyakumeiten Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/static/styles.css?v=20260520h">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="true" aria-controls="sidebar-content">絞り込み</button>
      <div id="sidebar-content" class="sidebar-content">
      <form id="search-form" class="filters">
        <label class="field field-year">
          <span>年</span>
          <select id="year-input" name="year">
            <option value="" selected>All</option>
            <option value="2025">2025</option>
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
            <option value="2017">2017</option>
          </select>
        </label>

        <label class="field field-genre">
          <span>ジャンル</span>
          <details id="genre-picker" class="genre-picker">
            <summary id="genre-picker-summary" class="genre-picker-summary">All</summary>
            <div class="genre-picker-panel">
              <div class="genre-picker-actions">
                <button id="genre-toggle-all" class="field-mini-button" type="button">全選択</button>
              </div>
              <div id="genre-toggle-group" class="genre-option-list" role="group" aria-label="Genre filters"></div>
            </div>
          </details>
        </label>

        <label class="field field-name">
          <span>店名</span>
          <input id="name-input" name="name_query" type="text" placeholder="鮨">
        </label>

        <div class="button-row button-row-primary field field-actions">
          <button type="submit" class="search-mode-button is-active" data-search-mode="static">検索</button>
          <button type="submit" class="search-mode-button" data-search-mode="business">営業確認</button>
        </div>

        <div class="reservation-query-heading field field-reservation-query-heading">予約用クエリ</div>

        <div id="reservation-fields" class="reservation-fields">
          <label class="field field-date">
            <span>日付</span>
            <input id="reservation-date-input" name="reservation_date" type="date" value="2026-05-25">
          </label>

          <label class="field field-party-size reservation-detail-field">
            <span>人数</span>
            <input id="party-size-input" name="party_size" type="number" min="1" max="12" value="2">
          </label>

          <label class="field field-time-window reservation-detail-field">
            <span>時間帯</span>
            <select id="time-window-input" name="time_window">
              <option value="dinner">dinner</option>
              <option value="lunch">lunch</option>
            </select>
          </label>

          <label class="field field-reservation-status reservation-detail-field">
            <span>予約状態</span>
            <select id="reservation-status-input" name="reservation_status">
              <option value="">All</option>
              <option value="bookable">予約可能</option>
              <option value="sold_out">空席なし</option>
              <option value="booking_closed">受付外</option>
              <option value="temporarily_closed">休業</option>
              <option value="not_supported">予約サイト対象外</option>
              <option value="provider_unlinked">予約リンク未設定</option>
              <option value="provider_error">取得失敗</option>
              <option value="unknown">要確認</option>
            </select>
          </label>

          <label class="field field-provider reservation-detail-field">
            <span>サイト</span>
            <select id="provider-input" name="provider">
              <option value="">All</option>
              <option value="tabelog">tabelog</option>
            </select>
          </label>
        </div>

        <div class="button-row button-row-reservation field field-submit">
          <button type="submit" class="search-mode-button search-mode-button-reservation" data-search-mode="reservation">予約可能店舗検索</button>
        </div>
      </form>

      <section class="status-panel">
        <div id="status-text">地図を読み込み中...</div>
        <div id="warning-text" class="warning"></div>
      </section>

      <section class="results-panel">
        <div class="results-meta">
          <strong id="result-count">0</strong>
          <span>shops in view</span>
        </div>
        <ul id="result-list" class="result-list"></ul>
      </section>
      </div>
    </aside>

    <main class="map-area">
      <div id="map"></div>
      <section class="map-hud" aria-label="Map summary">
        <div class="map-hud-card map-hud-card-primary">
          <div class="map-hud-label">Map View</div>
          <div id="map-hud-status" class="map-hud-status">地図を読み込み中...</div>
          <div id="map-hud-filters" class="map-hud-filters">Viewport search</div>
        </div>
        <details class="map-hud-card map-hud-card-legend map-hud-legend">
          <summary class="map-hud-legend-toggle">
            <span>Legend</span>
            <span id="map-hud-legend-preview" class="map-hud-legend-preview" aria-hidden="true">
            </span>
          </summary>
          <div id="map-legend" class="map-legend">
          </div>
        </details>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/static/app.js?v=20260520h"></script>
</body>
</html>
